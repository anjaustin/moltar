<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TriX - Cognitive Assistant</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: #16213e;
            padding: 12px 16px;
            border-bottom: 1px solid #0f3460;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .header h1 {
            font-size: 18px;
            font-weight: 600;
            color: #e94560;
        }
        
        .header .status {
            font-size: 12px;
            color: #4ecca3;
            margin-left: auto;
        }
        
        .header .status.offline {
            color: #e94560;
        }
        
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 16px;
            line-height: 1.4;
            font-size: 15px;
            word-wrap: break-word;
        }
        
        .message.user {
            background: #0f3460;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        
        .message.assistant {
            background: #16213e;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid #0f3460;
        }
        
        .message.system {
            background: transparent;
            align-self: center;
            color: #888;
            font-size: 12px;
            padding: 4px 8px;
        }
        
        .message.error {
            background: #4a1a1a;
            border: 1px solid #e94560;
        }
        
        .typing {
            color: #888;
            font-style: italic;
        }
        
        .input-container {
            padding: 12px 16px;
            background: #16213e;
            border-top: 1px solid #0f3460;
            display: flex;
            gap: 10px;
        }
        
        #input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #0f3460;
            border-radius: 24px;
            background: #1a1a2e;
            color: #eee;
            font-size: 16px;
            outline: none;
        }
        
        #input:focus {
            border-color: #4ecca3;
        }
        
        #input::placeholder {
            color: #666;
        }
        
        #send {
            padding: 12px 20px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        
        #send:disabled {
            background: #444;
            cursor: not-allowed;
        }
        
        #send:active:not(:disabled) {
            background: #c73e54;
        }
        
        .stats {
            font-size: 11px;
            color: #666;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>TriX</h1>
        <span>LFM2-350M @ 45 t/s</span>
        <span class="status" id="status">Connecting...</span>
    </div>
    
    <div class="chat-container" id="chat">
        <div class="message system">Cognitive Assistant running on-device</div>
    </div>
    
    <div class="input-container">
        <input type="text" id="input" placeholder="Ask me anything..." autocomplete="off">
        <button id="send">Send</button>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:8080';
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send');
        const status = document.getElementById('status');
        
        let conversationHistory = [];
        
        // Check server health
        async function checkHealth() {
            try {
                const res = await fetch(`${API_URL}/health`, { method: 'GET' });
                const data = await res.json();
                if (data.status === 'ok') {
                    status.textContent = 'Online';
                    status.classList.remove('offline');
                    return true;
                }
            } catch (e) {
                status.textContent = 'Offline';
                status.classList.add('offline');
            }
            return false;
        }
        
        function addMessage(content, role, stats = null) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.textContent = content;
            if (stats) {
                const statsDiv = document.createElement('div');
                statsDiv.className = 'stats';
                statsDiv.textContent = stats;
                div.appendChild(statsDiv);
            }
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return div;
        }
        
        function removeMessage(el) {
            if (el && el.parentNode) {
                el.parentNode.removeChild(el);
            }
        }
        
        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;
            
            input.value = '';
            sendBtn.disabled = true;
            
            // Add user message
            addMessage(text, 'user');
            conversationHistory.push({ role: 'user', content: text });
            
            // Show typing indicator
            const typingEl = addMessage('Thinking...', 'assistant typing');
            
            try {
                const startTime = performance.now();
                
                const res = await fetch(`${API_URL}/v1/chat/completions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: [
                            { role: 'system', content: 'You are TriX, a helpful AI assistant running locally on a Motorola phone. Be concise but friendly.' },
                            ...conversationHistory
                        ],
                        max_tokens: 200,
                        temperature: 0.7
                    })
                });
                
                const data = await res.json();
                const elapsed = ((performance.now() - startTime) / 1000).toFixed(1);
                
                removeMessage(typingEl);
                
                if (data.choices && data.choices[0]) {
                    const content = data.choices[0].message.content;
                    const tokens = data.usage ? data.usage.completion_tokens : '?';
                    const tps = data.usage ? (data.usage.completion_tokens / (elapsed)).toFixed(1) : '?';
                    
                    conversationHistory.push({ role: 'assistant', content: content });
                    addMessage(content, 'assistant', `${tokens} tokens in ${elapsed}s (${tps} t/s)`);
                } else if (data.error) {
                    addMessage(`Error: ${data.error.message}`, 'assistant error');
                }
            } catch (e) {
                removeMessage(typingEl);
                addMessage(`Connection error: ${e.message}`, 'assistant error');
            }
            
            sendBtn.disabled = false;
            input.focus();
        }
        
        // Event listeners
        sendBtn.addEventListener('click', sendMessage);
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
        
        // Initial health check
        checkHealth();
        setInterval(checkHealth, 10000);
        
        // Focus input
        input.focus();
    </script>
</body>
</html>
